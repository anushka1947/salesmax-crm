services:
  - type: web
    name: salesmax-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: salesmax-db
          property: connectionString

databases:
  - name: salesmax-db
    databaseName: salesmax
    user: postgres
    plan: free
